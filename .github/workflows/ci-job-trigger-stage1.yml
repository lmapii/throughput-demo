name: ECW CI Trigger - Stage 1 (Reserve)

# Event-driven alternative to ci-job-smoke.yml, 1 of 2 -- see
# docs/07-trigger-mode.md before enabling this.
#
# Instead of a runner sitting in a "Wait" job polling ECW until the booking
# becomes active (what ci-job-smoke.yml does), this run reserves,
# registers a session-activation trigger with ECW, and STOPS. Minutes/cost
# stop accruing the moment this workflow ends. When ECW activates the
# session it fires "Stage 2" (ci-job-trigger-stage2.yml) itself via the
# workflow_dispatch REST API, passing the booking context as inputs.
#
# Reusable workflow, called from ci.yml after its build. It has no build of
# its own: the caller must upload the firmware as artifact
# `ecw-firmware-<run_id>-<board_name>` (a single .bin at the artifact root).
# A called workflow shares the caller's run_id/sha, which is what Stage 2
# uses to find that artifact.
#
# Use this pipeline OR ci-job-smoke.yml, not both, against the same booking.

on:
  workflow_call:
    inputs:
      active_ref:
        description: >-
          Git ref (branch or tag) Stage 2 should check out and run on.
          Defaults to the ref that started this run.
        type: string
        required: false
        default: ""
      board_name:
        description: >-
          Exact ECW board name to reserve. Empty skips this workflow, so a
          caller can pass its whole build matrix. The firmware artifact must
          be named `ecw-firmware-<run_id>-<board_name>`.
        type: string
        required: false
        default: ""

env:
  ECW_BACKEND_URL: ${{ vars.ECW_BACKEND_URL || 'https://api-dev.edgebench.io' }}

jobs:
  reserve:
    name: Reserve & register trigger
    if: inputs.board_name != ''
    runs-on: ubuntu-latest
    outputs:
      booking_id: ${{ steps.booking.outputs.booking_id }}
      board_name: ${{ steps.board.outputs.board_name }}

    env:
      ECW_API_KEY: ${{ secrets.ECW_API_KEY }}
      ECW_DISPATCH_PAT: ${{ secrets.ECW_DISPATCH_PAT }}
      BOARD_NAME: ${{ inputs.board_name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # first, so the always() upload at the end has a name even if a later step fails
      - name: Name reserve artifact
        id: reserve-artifact
        run: |
          echo "name=ecw-ci-trigger-reserve-${{ github.run_id }}-$(sh .github/scripts/artifact_safe.sh "${BOARD_NAME}")" >> "$GITHUB_OUTPUT"

      - name: Check required secrets
        run: |
          set -euo pipefail

          if [ -z "${ECW_API_KEY}" ]; then
            echo "Missing ECW_API_KEY repository secret."
            exit 1
          fi
          if [ -z "${ECW_DISPATCH_PAT}" ]; then
            echo "Missing ECW_DISPATCH_PAT repository secret (fine-grained PAT, Actions: Read and write) -- see docs/07-trigger-mode.md."
            exit 1
          fi

      - name: Check backend health
        run: |
          set -euo pipefail

          curl --fail --silent --show-error \
            "${ECW_BACKEND_URL%/}/docs" \
            --output /dev/null

      - name: Select board type
        id: board
        run: python3 .github/scripts/select_board.py

      # select_board.py matches by substring, but Stage 2 locates the firmware
      # artifact by the board name ECW injects, so the two must be identical
      - name: Check board name is exact
        env:
          SELECTED: ${{ steps.board.outputs.board_name }}
        run: |
          if [ "${SELECTED}" != "${BOARD_NAME}" ]; then
            echo "::error::board_name '${BOARD_NAME}' is not an exact ECW board name (closest match: '${SELECTED}')."
            exit 1
          fi

      - name: Find or create booking
        id: booking
        env:
          ECW_BOARD_NAME: ${{ steps.board.outputs.board_name }}
        run: python3 .github/scripts/find_or_create_booking.py

      # TODO: a cancel between the booking above and this step leaves the booking with
      #       neither a trigger nor a release (the next run reuses it, see
      #       find_or_create_booking.py); add an `if: cancelled()` step that releases it.
      - name: Register session-activation trigger
        env:
          ECW_BOOKING_ID: ${{ steps.booking.outputs.booking_id }}
          ECW_ACTIVE_WORKFLOW: ci-job-trigger-stage2.yml
          ECW_ACTIVE_REF: ${{ inputs.active_ref }}
        run: python3 .github/scripts/register_activation_trigger.py

      - name: Upload reserve artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.reserve-artifact.outputs.name || format('ecw-ci-trigger-reserve-{0}', github.run_id) }}
          path: artifacts/
          if-no-files-found: warn
